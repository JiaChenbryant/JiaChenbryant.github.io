<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color-Code Image Verification</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; color: #253044; background: #f8fafc; }
    .main-layout { display: flex; flex-direction: column; align-items: center; padding: 36px 16px; }
    .upload-group, .image-preview { display: flex; flex-wrap: wrap; justify-content: center; gap: 32px; width: 100%; }
    .upload-section { width: 300px; text-align: center; }
    .custom-upload { display: inline-block; padding: 12px 16px; color: white; background: #2563eb; border-radius: 8px; cursor: pointer; }
    .hidden-input { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
    .result { margin-top: 12px; min-height: 44px; padding: 10px; background: #fff; border: 1px solid #dbe1e8; border-radius: 8px; line-height: 1.7; }
    .preview-container { width: 300px; height: 200px; border: 2px dashed #cbd5e1; border-radius: 8px; background: #fff; display: flex; align-items: center; justify-content: center; }
    .preview-container img { max-width: 100%; max-height: 100%; object-fit: contain; }
    #verifyButton { margin: 26px 0; padding: 12px 30px; font-size: 16px; background: #0f766e; border: 0; border-radius: 8px; color: white; cursor: pointer; }
    #verifyButton:hover { background: #115e59; }
    #verificationResult { min-height: 22px; font-weight: bold; text-align: center; }
  </style>
</head>
<body>
  <div class="main-layout">
    <h2>Color-Code Image Verification</h2>
    <div class="upload-group">
      <div class="upload-section">
        <label class="custom-upload">
          <input type="file" id="standardFile" accept="image/*" class="hidden-input">
          Upload Standard Image
        </label>
        <div id="standardResult" class="result">No standard image uploaded</div>
      </div>
      <div class="upload-section">
        <label class="custom-upload">
          <input type="file" id="testFile" accept="image/*" class="hidden-input">
          Upload Verification Image
        </label>
        <div id="testResult" class="result">No verification image uploaded</div>
      </div>
    </div>
    <button id="verifyButton" type="button" onclick="verifyFunction()">Verify</button>
    <div id="verificationResult" role="status" aria-live="polite"></div>
    <div class="image-preview">
      <div class="preview-container"><img id="standardPreview" alt="Standard Image Preview"></div>
      <div class="preview-container"><img id="testPreview" alt="Verification Image Preview"></div>
    </div>
  </div>

  <script>
    let standardResult = null;
    let testResult = null;

    // Resize images while preserving aspect ratio. Do not upscale small images.
    function processImage(img, resultDiv) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const MAX_SIZE = 500;
      const scale = Math.min(1, MAX_SIZE / img.width, MAX_SIZE / img.height);
      canvas.width = Math.max(1, Math.round(img.width * scale));
      canvas.height = Math.max(1, Math.round(img.height * scale));
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const hsvData = rgbToHSV(imageData.data);
      const result = analyzeColors(hsvData, canvas.width, canvas.height);
      resultDiv.innerHTML = `green ratio: ${(result.g * 100).toFixed(1)}%<br>blue ratio: ${(result.b * 100).toFixed(1)}%`;
      return result;
    }

    function rgbToHSV(rgbData) {
      const hsvData = new Array(rgbData.length / 4);
      for (let i = 0; i < rgbData.length; i += 4) {
        const r = rgbData[i] / 255;
        const g = rgbData[i + 1] / 255;
        const b = rgbData[i + 2] / 255;
        const max = Math.max(r, g, b);
        const min = Math.min(r, g, b);
        const d = max - min;
        let h = 0;
        if (d !== 0) {
          if (max === r) h = ((g - b) / d + (g < b ? 6 : 0)) / 6;
          else if (max === g) h = ((b - r) / d + 2) / 6;
          else h = ((r - g) / d + 4) / 6;
        }
        const s = max === 0 ? 0 : d / max;
        hsvData[i / 4] = [h, s, max];
      }
      return hsvData;
    }

    // Brightness threshold V >= 0.7; retain 4-connected regions with at least 200 pixels.
    // Green hue: 0.22-0.45 (approx. 80-162 degrees); blue hue: 0.50-0.72 (180-259.2 degrees).
    function analyzeColors(hsvData, width, height) {
      const vMask = new Uint8Array(width * height);
      for (let i = 0; i < hsvData.length; i++) {
        if (hsvData[i][2] >= 0.7) vMask[i] = 1;
      }
      const validMask = findValidRegions(vMask, width, height, 200);
      let flowerArea = 0;
      let greenPixels = 0;
      let bluePixels = 0;
      for (let i = 0; i < hsvData.length; i++) {
        if (!validMask[i]) continue;
        flowerArea++;
        const [h, s] = hsvData[i];
        if (s < 0.3) continue;
        if (h >= 0.50 && h <= 0.72) bluePixels++;
        else if (h >= 0.22 && h <= 0.45) greenPixels++;
      }
      return {
        g: flowerArea ? greenPixels / flowerArea : 0,
        b: flowerArea ? bluePixels / flowerArea : 0
      };
    }

    // Iterative flood fill: return a mask of pixels belonging to qualifying regions.
    function findValidRegions(mask, width, height, minArea) {
      const visited = new Uint8Array(mask.length);
      const valid = new Uint8Array(mask.length);
      for (let start = 0; start < mask.length; start++) {
        if (!mask[start] || visited[start]) continue;
        const stack = [start];
        const pixels = [];
        visited[start] = 1;
        while (stack.length) {
          const idx = stack.pop();
          pixels.push(idx);
          const x = idx % width;
          const y = Math.floor(idx / width);
          const neighbors = [];
          if (x > 0) neighbors.push(idx - 1);
          if (x + 1 < width) neighbors.push(idx + 1);
          if (y > 0) neighbors.push(idx - width);
          if (y + 1 < height) neighbors.push(idx + width);
          for (const next of neighbors) {
            if (mask[next] && !visited[next]) {
              visited[next] = 1;
              stack.push(next);
            }
          }
        }
        if (pixels.length >= minArea) {
          for (const idx of pixels) valid[idx] = 1;
        }
      }
      return valid;
    }

    function setupFileInput(inputId, resultId, previewId) {
      document.getElementById(inputId).addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        if (inputId === 'standardFile') standardResult = null;
        else testResult = null;
        document.getElementById('verificationResult').textContent = '';
        const resultDiv = document.getElementById(resultId);
        resultDiv.textContent = 'Processing image...';
        const reader = new FileReader();
        reader.onerror = () => { resultDiv.textContent = 'Failed to read file'; };
        reader.onload = function(event) {
          const img = new Image();
          img.onerror = () => { resultDiv.textContent = 'Unable to load image'; };
          img.onload = function() {
            document.getElementById(previewId).src = event.target.result;
            try {
              const result = processImage(img, resultDiv);
              if (inputId === 'standardFile') standardResult = result;
              else testResult = result;
            } catch (err) {
              resultDiv.textContent = 'Image processing failed: ' + err.message;
            }
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    setupFileInput('standardFile', 'standardResult', 'standardPreview');
    setupFileInput('testFile', 'testResult', 'testPreview');

    function verifyFunction() {
      const output = document.getElementById('verificationResult');
      if (!standardResult || !testResult) {
        output.textContent = 'Please upload both the standard and verification images.';
        alert(output.textContent);
        return;
      }
      const g0 = standardResult.g;
      const b0 = standardResult.b;
      if (g0 === 0 || b0 === 0) {
        output.textContent = 'No valid green or blue region detected in the standard image. Check the lighting and color thresholds.';
        alert(output.textContent);
        return;
      }
      const gDifference = (g0 - testResult.g) / g0;
      const bDifference = (b0 - testResult.b) / b0;
      if (Math.abs(gDifference) < 0.1 && Math.abs(bDifference) < 0.1) {
        output.textContent = 'Image verification successful!';
      } else {
        output.textContent = 'Image verification failed.';
      }
      alert(output.textContent);
    }
  </script>
</body>
</html>
